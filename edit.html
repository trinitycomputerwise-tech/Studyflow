
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Assignment — StudyFlow</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <header>
            <h1>Edit Assignment</h1>
            <p>Update your study plan.</p>
        </header>

        <section class="panel">
            <form method="post">
                <label for="title">Assignment title</label>
                <input id="title" name="title"
                       value="{{ task['title'] }}"
                       maxlength="150" required>

                <label for="subject">Subject</label>
                <input id="subject" name="subject"
                       value="{{ task['subject'] }}"
                       maxlength="100" required>

                <label for="due_date">Due date</label>
                <input id="due_date" name="due_date" type="date"
                       value="{{ task['due_date'] }}" required>

                <label for="priority">Priority</label>
                <select id="priority" name="priority" required>
                    <option value="Low"
                        {% if task['priority'] == 'Low' %}selected{% endif %}>
                        Low
                    </option>
                    <option value="Medium"
                        {% if task['priority'] == 'Medium' %}selected{% endif %}>
                        Medium
                    </option>
                    <option value="High"
                        {% if task['priority'] == 'High' %}selected{% endif %}>
                        High
                    </option>
                </select>

                <button type="submit">Save changes</button>
                <a href="{{ url_for('index') }}">Cancel</a>
            </form>
        </section>
    </main>
</body>
</html>
